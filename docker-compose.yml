x-backend: &backend
  build:
    context: ./backend-server
    target: runtime
  expose:
    - "3001"
  restart: unless-stopped
  environment: &backend-environment
    NODE_ENV: production
    PORT: 3001
    CORS_ORIGIN: http://localhost:3000
  healthcheck:
    test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
    interval: 10s
    timeout: 5s
    retries: 5
    start_period: 10s

services:
  identity-service:
    <<: *backend
    image: local/sigmapay-identity:demo
    environment:
      <<: *backend-environment
      SERVICE_DOMAIN: identity

  finance-service:
    <<: *backend
    image: local/sigmapay-finance:demo
    environment:
      <<: *backend-environment
      SERVICE_DOMAIN: finance

  savings-service:
    <<: *backend
    image: local/sigmapay-savings:demo
    environment:
      <<: *backend-environment
      SERVICE_DOMAIN: savings

  payments-service:
    <<: *backend
    image: local/sigmapay-payments:demo
    environment:
      <<: *backend-environment
      SERVICE_DOMAIN: payments

  notifications-service:
    <<: *backend
    image: local/sigmapay-notifications:demo
    environment:
      <<: *backend-environment
      SERVICE_DOMAIN: notifications

  features-service:
    <<: *backend
    image: local/sigmapay-features:demo
    environment:
      <<: *backend-environment
      SERVICE_DOMAIN: features

  api-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./gateway/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      identity-service:
        condition: service_healthy
      finance-service:
        condition: service_healthy
      savings-service:
        condition: service_healthy
      payments-service:
        condition: service_healthy
      notifications-service:
        condition: service_healthy
      features-service:
        condition: service_healthy
    ports:
      - "3001:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  frontend:
    build:
      context: ./frontend-client
      target: runtime
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:3001}
    image: local/sigmapay-frontend:demo
    restart: unless-stopped
    depends_on:
      api-gateway:
        condition: service_healthy
    ports:
      - "3000:80"
