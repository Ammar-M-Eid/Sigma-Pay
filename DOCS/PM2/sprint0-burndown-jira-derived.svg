<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">SigmaPay Sprint 0 burndown derived from Jira history</title>
  <desc id="desc">Planned remaining points fall evenly from 13 on October 22 to zero on November 5. Jira issue history shows 13 actual points through October 27 and zero from October 28 onward, when all three stories were marked Done.</desc>
