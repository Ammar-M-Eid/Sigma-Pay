server {
  listen 80;
  server_name _;

  # Resolve Compose service names at request time so the gateway follows
  # containers that are recreated by `docker compose up --build`.
  resolver 127.0.0.11 valid=10s ipv6=off;
  set $identity_backend identity-service:3001;
  set $finance_backend finance-service:3001;
  set $savings_backend savings-service:3001;
  set $payments_backend payments-service:3001;
  set $notifications_backend notifications-service:3001;

  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_connect_timeout 3s;
  proxy_read_timeout 30s;

  location = /health {
    proxy_pass http://$finance_backend;
  }

  location /api/accounts/ {
    proxy_pass http://$identity_backend;
  }

  location /api/budgets/ {
    proxy_pass http://$finance_backend;
  }

  location /api/goals/ {
    proxy_pass http://$finance_backend;
  }

  location /api/reports/ {
    proxy_pass http://$finance_backend;
  }

  location /api/groups/ {
    proxy_pass http://$savings_backend;
  }

  location /api/payments/ {
    proxy_pass http://$payments_backend;
  }

  # The slash-terminated prefix locations below otherwise trigger an Nginx
  # 301 on POST /api/bills, which changes the method during redirect handling.
  location = /api/bills {
    proxy_pass http://$payments_backend;
  }

  location /api/bills/ {
    proxy_pass http://$payments_backend;
  }

  location /api/notifications/ {
    proxy_pass http://$notifications_backend;
  }

  location /api/ {
    return 404;
  }

  location / {
    return 404;
  }
}
