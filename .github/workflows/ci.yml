name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend-server/package-lock.json
            frontend-client/package-lock.json
      - name: Build backend
        working-directory: backend-server
        run: npm ci && npm run build
      - name: Build frontend
        working-directory: frontend-client
        run: npm ci && npm run build
      - name: Build container images
        run: docker compose build

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image namespace
        id: image
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ./backend-server
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/sigmapay-backend:latest
            ${{ steps.image.outputs.namespace }}/sigmapay-backend:sha-${{ github.sha }}
      - uses: docker/build-push-action@v6
        with:
          context: ./frontend-client
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/sigmapay-frontend:latest
            ${{ steps.image.outputs.namespace }}/sigmapay-frontend:sha-${{ github.sha }}
