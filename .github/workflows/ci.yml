name: CI

on:
  pull_request:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend-server/package-lock.json
            frontend-client/package-lock.json
      - name: Build backend
        working-directory: backend-server
        run: npm ci --ignore-scripts && npm test
      - name: Upload backend coverage
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: backend-coverage
          path: backend-server/coverage/lcov.info
      - name: Build frontend
        working-directory: frontend-client
        run: npm ci && npm run build
      - name: Build container images
        run: docker compose build

  sonarqube:
    if: ${{ vars.SONAR_HOST_URL != '' }}
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend-server/package-lock.json
      - name: Generate coverage
        working-directory: backend-server
        run: npm ci --ignore-scripts && npm test
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@70bad232163b09d998ea0707ee80c0ec80798c16 # v8.5.1
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
      - name: Enforce quality gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        timeout-minutes: 5
        env:
          SONAR_HOST_URL: ${{ vars.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

  publish:
    if: >-
      always() && github.event_name == 'push' && github.ref == 'refs/heads/main' &&
      needs.validate.result == 'success' &&
      (vars.SONAR_HOST_URL == '' || needs.sonarqube.result == 'success')
    needs: [validate, sonarqube]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Set lowercase image namespace
        id: image
        run: echo "namespace=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./backend-server
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/sigmapay-backend:latest
            ${{ steps.image.outputs.namespace }}/sigmapay-backend:sha-${{ github.sha }}
      - uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ./frontend-client
          push: true
          tags: |
            ${{ steps.image.outputs.namespace }}/sigmapay-frontend:latest
            ${{ steps.image.outputs.namespace }}/sigmapay-frontend:sha-${{ github.sha }}
